# TeamFlowManager Nginx 配置模板
# 上传到: /etc/nginx/sites-available/teamflow

server {
    listen 80;
    server_name YOUR_DOMAIN.com www.YOUR_DOMAIN.com;
    root /var/www/teamflow;
    index index.html;
    charset utf-8;

    # -------------------------------------------------------------------------
    # 1. SPA 路由支持 (关键！解决刷新404问题)
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------------------
    # 2. 静态资源永久缓存
    # -------------------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept-Encoding;
        
        gzip on;
        gzip_types text/css application/javascript image/svg+xml;
    }

    # -------------------------------------------------------------------------
    # 3. PWA Service Worker 特殊配置（极其重要！）
    #    绝对不要缓存 Service Worker，否则用户永远收不到更新
    # -------------------------------------------------------------------------
    location ~* (sw|workbox-.*)\.js$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Service-Worker-Allowed "/";
        gzip off;
    }

    # -------------------------------------------------------------------------
    # 4. index.html 每次重新验证
    # -------------------------------------------------------------------------
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, public, must-revalidate, proxy-revalidate";
    }

    # -------------------------------------------------------------------------
    # 5. 安全头
    # -------------------------------------------------------------------------
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -------------------------------------------------------------------------
    # 6. 日志
    # -------------------------------------------------------------------------
    server_tokens off;
    access_log /var/log/nginx/teamflow.access.log;
    error_log /var/log/nginx/teamflow.error.log;
}
